<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Catcher Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-container">
    <header class="arcade-header">
      <div class="arcade-badge">PHASE 4: COIN COLLECTION &amp; SCORE</div>
      <h1 class="arcade-title">COIN CATCHER</h1>
      <p class="arcade-subtitle">Classic 2D Arcade Experience</p>
    </header>

    <div class="hud-bar">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <span id="scoreDisplay" class="score-value">0</span>
      </div>
    </div>

    <div class="instructions-card">
      <h2>Controls &amp; Objectives</h2>
      <p>Use <span class="badge blue">Arrow Keys</span> or <span class="badge blue">W A S D</span> to collect <span class="badge yellow">Gold Coins</span>! The Red Enemy remains stationary.</p>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <footer class="arcade-footer">
      <p>Canvas Resolution: <strong>800 &times; 450</strong> | Vanilla HTML5 &bull; CSS3 &bull; JavaScript</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
